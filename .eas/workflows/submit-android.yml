name: Submit android
on:
  push:
    branches: ['production']
jobs:
  build_android:
    name: Build Android app
    type: build
    params:
      platform: android
      profile: production
  submit_android:
    name: Submit to Google Play Store
    type: submit
    params:
      platform: android
      build_id: ${{ needs.build_android.outputs.build_id }}

      